<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MegChatBox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth">
    <section class="auth-card">
      <div class="brand"><i>💬</i><span>MegChatBox</span></div>
      <p class="muted">Connect with real people.</p>

      <div id="loginView">
        <h1>Welcome back</h1>
        <form id="loginForm">
          <label>Email<input id="loginEmail" type="email" autocomplete="email" required></label>
          <label>Password<input id="loginPassword" type="password" autocomplete="current-password" required></label>
          <button class="primary" type="submit">Login</button>
        </form>
        <button class="link" id="showSignup" type="button">Create account</button>
        <button class="link" id="forgotBtn" type="button">Forgot password?</button>
      </div>

      <div id="signupView" class="hidden">
        <h1>Create account</h1>
        <form id="signupForm">
          <label>Full name<input id="signupName" required maxlength="80"></label>
          <label>Username<input id="signupUsername" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_]+"></label>
          <label>Email<input id="signupEmail" type="email" required></label>
          <label>Password<input id="signupPassword" type="password" required minlength="6"></label>
          <label>Confirm password<input id="signupConfirm" type="password" required minlength="6"></label>
          <button class="primary" type="submit">Create account</button>
        </form>
        <button class="link" id="showLogin" type="button">Back to login</button>
      </div>

      <div id="forgotView" class="hidden">
        <h1>Reset password</h1>
        <form id="forgotForm">
          <label>Email<input id="forgotEmail" type="email" required></label>
          <button class="primary" type="submit">Send reset email</button>
        </form>
        <button class="link" id="forgotBack" type="button">Back</button>
      </div>
      <p id="authStatus" class="status"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="script.js"></script>
</body>
</html>
